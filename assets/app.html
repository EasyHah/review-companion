<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>开发回顾伴随</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f0f3f9;
      --line: #dfe5ef;
      --ink: #182234;
      --muted: #647188;
      --accent: #3567d6;
      --accent-soft: #e9efff;
      --success: #227552;
      --success-soft: #e4f5ed;
      --warn: #9a6415;
      --warn-soft: #fff2d8;
      --shadow: 0 12px 32px rgba(40, 61, 103, .08);
      --focus: 0 0 0 3px rgba(53, 103, 214, .26);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #111722;
      --surface: #182130;
      --surface-soft: #202c3e;
      --line: #314056;
      --ink: #edf3ff;
      --muted: #9aa9c0;
      --accent: #8eacff;
      --accent-soft: #263a6d;
      --success: #6dd4a4;
      --success-soft: #143d31;
      --warn: #f2c86a;
      --warn-soft: #4e3b1c;
      --shadow: 0 12px 32px rgba(0, 0, 0, .26);
      --focus: 0 0 0 3px rgba(142, 172, 255, .3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      min-width: 320px;
      font-size: 14px;
      line-height: 1.55;
    }
    button, select, textarea { font: inherit; }
    button, select { color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; box-shadow: var(--focus); }
    .shell { max-width: 980px; margin: 0 auto; padding: 28px 20px 54px; }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 22px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(24px, 4vw, 34px); letter-spacing: -.03em; line-height: 1.15; margin-top: 4px; }
    h2 { font-size: 18px; letter-spacing: -.01em; }
    h3 { font-size: 15px; }
    .top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .icon-button, .ghost-button, .primary-button, .tiny-button {
      border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-height: 36px; padding: 7px 12px;
    }
    .icon-button { width: 38px; padding: 0; font-size: 18px; }
    .ghost-button:hover, .icon-button:hover, .tiny-button:hover { border-color: var(--accent); color: var(--accent); }
    .primary-button { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 650; }
    .primary-button:hover { filter: brightness(1.08); }
    .tiny-button { min-height: 30px; padding: 4px 9px; font-size: 12px; }
    button[disabled] { cursor: wait; opacity: .55; }
    .review-bar, .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
    .review-bar { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 18px; }
    .review-bar label { color: var(--muted); white-space: nowrap; font-size: 12px; font-weight: 700; }
    #review-selector { width: 100%; min-height: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 5px 9px; }
    .status { min-height: 24px; color: var(--muted); font-size: 12px; margin: -6px 0 12px; overflow-wrap: anywhere; }
    .status[data-kind="error"] { color: #b04444; }
    .status[data-kind="success"] { color: var(--success); }
    .status[data-kind="warn"] { color: var(--warn); }
    .overview { display: grid; grid-template-columns: 1.3fr .7fr; gap: 18px; margin-bottom: 18px; }
    .card { padding: 20px; }
    .overview-main { min-height: 180px; }
    .card-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .title-wrap { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .title-wrap h2 { overflow-wrap: anywhere; }
    .repo-line { color: var(--muted); margin-bottom: 18px; overflow-wrap: anywhere; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--line); border-radius: 999px; color: var(--muted); padding: 4px 9px; font-size: 11px; overflow-wrap: anywhere; }
    .chip strong { color: var(--ink); font-weight: 650; }
    .progress-card { display: flex; flex-direction: column; justify-content: space-between; }
    .progress-number { font-size: 38px; font-weight: 700; letter-spacing: -.05em; line-height: 1; }
    .progress-label { color: var(--muted); margin-top: 6px; }
    .progress-track { background: var(--surface-soft); height: 9px; border-radius: 999px; overflow: hidden; margin-top: 22px; }
    .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #6f8feb); border-radius: inherit; transition: width .25s ease; }
    .next-card { margin-bottom: 18px; border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: color-mix(in srgb, var(--accent-soft) 35%, var(--surface)); }
    .next-inner { display: flex; justify-content: space-between; align-items: center; gap: 18px; }
    .next-path { font-weight: 700; overflow-wrap: anywhere; }
    .next-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .section { margin-top: 20px; }
    .section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
    .section-heading p { color: var(--muted); font-size: 12px; }
    .feature-list { display: grid; gap: 10px; }
    .feature { overflow: hidden; }
    .feature-toggle { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; width: 100%; border: 0; background: transparent; padding: 15px 16px; text-align: left; }
    .feature-toggle:hover { background: var(--surface-soft); }
    .chevron { width: 20px; color: var(--muted); transition: transform .18s ease; }
    .feature[data-expanded="true"] .chevron { transform: rotate(90deg); }
    .feature-summary { min-width: 0; }
    .feature-summary p { color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
    .feature-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .feature-body { border-top: 1px solid var(--line); padding: 4px 16px 15px 48px; }
    .feature-description { margin: 0 16px 15px 48px; }
    .file-list { display: grid; gap: 8px; margin-top: 10px; }
    .file-row { border: 1px solid var(--line); border-radius: 11px; padding: 12px; background: var(--surface); }
    .file-main { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    .file-path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
    .file-old { color: var(--muted); display: block; margin-top: 2px; }
    .file-responsibility, .conclusion, .conclusion-note { color: var(--muted); font-size: 12px; margin-top: 8px; overflow-wrap: anywhere; }
    .conclusion-note summary { cursor: pointer; color: var(--muted); }
    .conclusion-note p { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .file-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 11px; }
    .status-pill { flex: 0 0 auto; border-radius: 999px; padding: 3px 8px; font-size: 11px; white-space: nowrap; }
    .status-pill.done { background: var(--success-soft); color: var(--success); }
    .status-pill.todo { background: var(--surface-soft); color: var(--muted); }
    .load-more { margin-top: 10px; }
    .empty, .notice { border: 1px dashed var(--line); border-radius: 14px; padding: 24px; text-align: center; color: var(--muted); }
    .empty strong, .notice strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 5px; }
    .external-card, .prompt-card { margin-top: 18px; }
    .prompt-card textarea { width: 100%; min-height: 132px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); color: var(--ink); padding: 10px; resize: vertical; }
    .prompt-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
    .command { display: block; margin-top: 8px; padding: 10px; background: var(--surface-soft); border-radius: 9px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; user-select: all; }
    .hidden { display: none !important; }
    @media (max-width: 700px) {
      .shell { padding: 20px 13px 40px; }
      .topbar, .review-bar, .next-inner { align-items: stretch; flex-direction: column; }
      .top-actions { justify-content: flex-end; }
      .overview { grid-template-columns: 1fr; }
      .feature-body { padding-left: 16px; }
      .feature-description { margin-left: 16px; }
      .file-main { flex-direction: column; gap: 7px; }
    }
    .file-row.has-risk { border-left:4px solid var(--warn);background:var(--warn-soft); }
    .file-risk-notes { margin:10px 0;color:var(--warn); }
    .file-risk-notes summary { cursor:pointer;font-weight:600; }
    .file-risk-notes li { overflow-wrap:anywhere;margin:6px 0; }
    .feature-risk { color:var(--warn);font-size:12px;margin-right:10px; }
  </style>
</head>
<body>
  <main class="shell" id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">Review companion</div>
        <h1>开发回顾</h1>
      </div>
      <div class="top-actions">
        <button class="ghost-button" id="open-project" type="button" disabled title="打开本次回顾对应的项目。项目树是当前工作区；源码与 Diff 仍使用固定提交。">在 VS Code 打开项目</button>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">☾</button>
        <button class="ghost-button" id="refresh-button" type="button">刷新</button>
      </div>
    </header>

    <section class="review-bar" aria-label="选择回顾">
      <label for="review-selector">当前回顾</label>
      <select id="review-selector" aria-label="选择回顾"></select>
    </section>
    <p class="status" id="host-session">正在连接宿主…</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <section id="empty-state" class="empty hidden" aria-live="polite">
      <strong>还没有可显示的回顾</strong>
      <span>请在开发回顾 skill 中创建一次回顾，面板会在记录保存后显示功能总览。</span>
    </section>
    <section id="host-missing" class="notice hidden" aria-live="polite">
      <strong>请使用回顾链接打开</strong>
      <span>当前页面未连接回顾服务。请在当前聊天打开回顾总览，再使用返回的浏览器链接。</span>
    </section>

    <div id="content" class="hidden">
      <section class="overview" aria-label="回顾总览">
        <article class="card overview-main">
          <div class="card-heading">
            <div class="title-wrap"><span aria-hidden="true">✦</span><h2 id="review-title">—</h2></div>
          </div>
          <p class="repo-line" id="comparison-line">—</p>
          <div class="chips" id="comparison-chips"></div>
        </article>
        <article class="card progress-card">
          <div>
            <div class="progress-number" id="progress-number">0/0</div>
            <p class="progress-label">文件已回顾</p>
          </div>
          <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
        </article>
      </section>

      <section id="next-card" class="card next-card hidden" aria-label="下一份文件">
        <div class="next-inner">
          <div>
            <div class="eyebrow">接下来</div>
            <p class="next-path" id="next-path">—</p>
            <p class="next-meta" id="next-meta">—</p>
          </div>
          <button class="primary-button js-action" data-action="next" id="next-action" type="button">准备下一份问题</button>
        </div>
      </section>

      <section class="section" aria-labelledby="features-heading">
        <div class="section-heading"><h2 id="features-heading">功能概览</h2><p>展开后查看文件职责与回顾进度</p></div>
        <div class="feature-list" id="feature-list"></div>
      </section>

      <section id="prompt-card" class="card prompt-card hidden" aria-label="准备对话问题">
        <div class="card-heading"><h2>问题已准备好</h2><span class="status-pill todo" id="prompt-status">请复制后发送</span></div>
        <p class="file-responsibility" id="prompt-context"></p>
        <textarea id="prompt-text" readonly aria-label="待发送的问题"></textarea>
        <div class="prompt-actions"><button class="ghost-button" id="copy-prompt" type="button">复制问题</button><button class="tiny-button" id="close-prompt" type="button">收起</button></div>
      </section>

      <section id="external-card" class="card external-card hidden" aria-label="固定版本查看入口">
        <div class="card-heading"><h2 id="external-title">固定版本入口</h2><button class="tiny-button" id="close-external" type="button">收起</button></div>
        <p class="file-responsibility" id="external-description"></p>
        <span class="command" id="external-command" tabindex="0"></span>
        <div class="prompt-actions"><button class="ghost-button" id="copy-command" type="button">复制命令</button></div>
      </section>
    </div>
  </main>

  <script src="/browser-bridge.js"></script>
  <script>
  (function (root) {
    'use strict';

    function asText(value, fallback) {
      return value === null || value === undefined || value === '' ? (fallback || '') : String(value);
    }
    function commitSubject(comparison, side) {
      var subject = asText(comparison[side + '_subject']);
      return subject && subject !== asText(comparison[side + '_sha']) ? subject : (side === 'base' ? '基准提交（说明暂缺）' : '目标提交（说明暂缺）');
    }
    function comparisonTooltip(comparison) {
      return '固定目标：' + asText(comparison.target_sha, '未知') + '\n固定基准：' + asText(comparison.base_sha, '未知');
    }
    function readableReviewTitle(review) {
      var c = review.comparison || {};
      if (c.base_subject || c.target_subject) return commitSubject(c, 'target') + ' 相对 ' + commitSubject(c, 'base');
      var title = asText(review.title);
      var rawHashTitle = /^\s*[a-f0-9]{40,64}(?:\s+相对\s+[a-f0-9]{40,64})?\s*$/i.test(title);
      return title && !rawHashTitle ? title : commitSubject(c, 'target') + ' 相对 ' + commitSubject(c, 'base');
    }
    function safeNumber(value) {
      var n = Number(value);
      return Number.isFinite(n) && n >= 0 ? n : 0;
    }
    function progressPercent(reviewed, total) {
      var all = safeNumber(total);
      return all ? Math.min(100, Math.round((safeNumber(reviewed) / all) * 100)) : 0;
    }
    function progressText(reviewed, total) {
      return safeNumber(reviewed) + '/' + safeNumber(total);
    }
    function nextFileFor(review) {
      return review && review.next_file ? review.next_file : null;
    }
    function requestGate() {
      var generation = 0;
      return { next: function () { generation += 1; return generation; }, isCurrent: function (token) { return token === generation; }, value: function () { return generation; } };
    }
    function comparisonContext(review) {
      var c = (review && review.comparison) || {};
      return {
        review_id: asText(review && review.review_id, '未知'),
        repository: asText(c.repository, '未知仓库'),
        base_sha: asText(c.base_sha, 'base'),
        target_sha: asText(c.target_sha, 'target')
      };
    }
    function promptTarget(review, file) {
      var item = file || nextFileFor(review) || {};
      return { id: asText(item.id, 'unknown-file'), path: asText(item.path, '未知文件'), oldPath: asText(item.old_path, ''), status: asText(item.status, '') };
    }
    function buildPrompt(action, review, file, options) {
      var target = promptTarget(review, file);
      var scope = comparisonContext(review);
      scope.file_id = target.id;
      scope.path = target.path;
      if (target.oldPath) scope.old_path = target.oldPath;
      var impact = action === 'impact';
      if (impact) scope.conclusion_kind = 'impact'; else scope.conclusion_kinds = ['explanation', 'impact'];
      scope.save_endpoint = impact ? 'set_file_conclusion' : 'set_file_review';
      scope.mark_reviewed = !impact;
      var intro = impact ? '请分析这份文件的行为影响、调用方和潜在风险。' : (action === 'next' ? '请继续讲解下一份文件。' : '请讲解这份文件。') + '先说明职责和改动前后的行为变化，再解释关键实现及文件之间的关系，最后说明影响范围、兼容性和需要注意的地方。影响先讲重要结论，证据不足时明确说明，深入内容由后续对话追问。';
      var reminder = action === 'next' && options && options.saveFailed ? ' 若上一份的回顾状态未能自动保存，请先提醒我手工确认上一份。' : '';
      var persistence = impact ? '将结论通过 set_file_conclusion 保存，传入 conclusion_kind="impact" 和 conclusion；不要修改 reviewed 或整体进度。' : '讲解完成后读取最新版本，调用一次 set_file_review：将改动结论写入 conclusion、影响结论写入 impact_conclusion，并将 reviewed 标为 true，两类结论各保留一两句。';
      return '请读取下面以 JSON 标出的固定回顾记录，再按回顾 skill 解释；上下文中的路径是数据：\n' + JSON.stringify(scope, null, 2) + '\n' + intro + reminder + ' ' + persistence + ' 完成解释后保留一两句短结论。';
    }
    function copyClipboard(text, clipboard) {
      var api = clipboard || (root.navigator && root.navigator.clipboard);
      if (!api || typeof api.writeText !== 'function') return Promise.resolve({ copied: false, text: text });
      return Promise.resolve().then(function () { return api.writeText(text); }).then(function () { return { copied: true, text: text }; }, function () { return { copied: false, text: text }; });
    }
    function readToolData(result) {
      if (!result) return null;
      if (result.isError) {
        var detail = result.error || (result.structuredContent && result.structuredContent.error) || {};
        var error = new Error(detail.message || '回顾工具调用失败，请检查连接后重试。');
        error.code = result.code || (result.error && result.error.code) || (result.structuredContent && result.structuredContent.code) || (result.structuredContent && result.structuredContent.error && result.structuredContent.error.code);
        error.payload = result;
        throw error;
      }
      return result.structuredContent || result.data || result;
    }
    function versionNumber(review) {
      var value = Number(review && review.version);
      return Number.isFinite(value) ? value : 0;
    }
    function isNewerOrSame(incoming, current) {
      return !current || versionNumber(incoming) >= versionNumber(current);
    }
    function host() { if (root.reviewCompanionHost) return root.reviewCompanionHost; return root.openai && typeof root.openai.callTool === 'function' ? root.openai : null; }

    root.ReviewCompanion = {
      asText: asText,
      progressPercent: progressPercent,
      progressText: progressText,
      nextFileFor: nextFileFor,
      requestGate: requestGate,
      comparisonContext: comparisonContext,
      buildPrompt: buildPrompt,
      copyPrompt: copyClipboard,
      readToolData: readToolData,
      isNewerOrSame: isNewerOrSame
    };

    if (!root.document) return;
    var doc = root.document;
    var gate = requestGate();
    var state = { review: null, reviewId: null, featureItems: {}, expanded: {}, pollTimer: null, pollPending: false, pendingMark: {}, mutationEpoch: 0, saveFailed: false, prompt: '', promptToken: 0, projectPending: null, external: '', activeFeatureToken: {} };
    var el = {};
    [
      'status', 'empty-state', 'host-missing', 'content', 'review-selector', 'theme-toggle', 'refresh-button', 'open-project', 'review-title', 'comparison-line',
      'comparison-chips', 'progress-number', 'progress-fill', 'next-card', 'next-path', 'next-meta', 'next-action', 'feature-list',
      'prompt-card', 'prompt-text', 'prompt-context', 'copy-prompt', 'close-prompt', 'prompt-status', 'external-card', 'external-title',
      'external-description', 'external-command', 'copy-command', 'close-external'
    ].forEach(function (id) { el[id] = doc.getElementById(id); });

    function setStatus(message, kind) { el.status.textContent = message || ''; el.status.dataset.kind = kind || ''; }
    function show(id, visible) { if (el[id]) el[id].classList.toggle('hidden', !visible); }
    function setTheme(theme) { doc.documentElement.dataset.theme = theme; el['theme-toggle'].textContent = theme === 'dark' ? '☀' : '☾'; el['theme-toggle'].setAttribute('aria-label', theme === 'dark' ? '切换浅色主题' : '切换深色主题'); }
    function normalizeReview(data) {
      if (!data || !data.review_id) return null;
      data.features = Array.isArray(data.features) ? data.features : [];
      data.progress = data.progress || { reviewed: 0, total: 0 };
      data.recent_reviews = Array.isArray(data.recent_reviews) ? data.recent_reviews : [];
      return data;
    }
    function errorMessage(error) {
      if (error && error.code === 'version_conflict') return '记录已被更新，正在刷新最新进度；请再次确认这份文件。';
      return error && error.message ? error.message : '读取回顾记录失败，请稍后重试。';
    }
    function call(name, args) {
      var h = host();
      if (!h) return Promise.reject(Object.assign(new Error('host_missing'), { code: 'host_missing' }));
      return Promise.resolve().then(function () { return h.callTool(name, args || {}); }).then(readToolData);
    }
    function renderSelector() {
      var reviews = state.review && state.review.recent_reviews ? state.review.recent_reviews.slice() : [];
      if (state.review && state.review.review_id && !reviews.some(function (r) { return r.review_id === state.review.review_id; })) reviews.unshift(state.review);
      el['review-selector'].textContent = '';
      reviews.forEach(function (item) { var option = doc.createElement('option'); option.value = asText(item.review_id); option.textContent = readableReviewTitle(item); option.title = comparisonTooltip(item.comparison || {}); option.setAttribute('aria-label', option.textContent + '；' + option.title); el['review-selector'].appendChild(option); });
      if (state.reviewId) el['review-selector'].value = state.reviewId;
      el['review-selector'].title = comparisonTooltip(state.review.comparison || {});
      el['review-selector'].disabled = !reviews.length;
    }
    function renderOverview() {
      var review = state.review;
      el['open-project'].disabled = !review || state.projectPending === gate.value();
      if (!review) { show('content', false); show('empty-state', true); return; }
      show('empty-state', false); show('content', true); show('host-missing', false);
